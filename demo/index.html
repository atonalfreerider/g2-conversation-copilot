<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>G2 Copilot Prototype</title>
<style>
body{margin:0;background:#10130f;color:#edf7ea;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(900px,92vw)}
.glass{aspect-ratio:2/1;background:#030604;border:1px solid #506853;border-radius:40% 40% 22% 22%;box-shadow:0 0 60px #7dff8a22 inset;display:grid;place-items:center;margin:24px 0}.screen{width:576px;max-width:78%;color:#9dff9f;font:22px ui-monospace,monospace;line-height:1.38;white-space:pre-wrap;text-shadow:0 0 8px #75ff83}
.controls{display:flex;gap:10px;flex-wrap:wrap}button,select,input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #607863;background:#192019;color:#eef8ec}input{flex:1;min-width:260px}.hint{color:#9baa9a}
</style>
<main class="wrap"><h1>Conversation Copilot</h1><p class="hint">Local interaction mock — no audio or network leaves this page.</p><div class="glass"><div id="screen" class="screen"></div></div>
<div class="controls"><button id="mode">Mode: playful</button><input id="utterance" value="I changed careers last year because I wanted something meaningful"><button id="hear">Hear them</button><button id="say">I said it</button></div>
<div class="controls" style="margin-top:10px"><button data-ring="swipe_up">R1 ← safer / inquisitive</button><button data-ring="press">R1 switch axis</button><button data-ring="swipe_down">R1 riskier / declarative →</button><button data-ring="double_press">R1 stop</button></div></main>
<script type="module">
import {ConversationCopilot,mockSuggestionEngine} from "../src/copilot.js";
const c=new ConversationCopilot(); c.start(); const screen=document.querySelector("#screen"); const draw=()=>screen.textContent=c.displayLines().join("\n"); draw();
document.querySelector("#mode").onclick=e=>{c.toggleMode();e.target.textContent=`Mode: ${c.state.mode}`;draw()};
const ingest=speaker=>{if(!c.state.listening)c.start();c.ingest({speaker,language:speaker==="user"?"English":"unknown",text:document.querySelector("#utterance").value},mockSuggestionEngine);draw()};
document.querySelector("#hear").onclick=()=>ingest("other");document.querySelector("#say").onclick=()=>ingest("user");document.querySelectorAll("[data-ring]").forEach(b=>b.onclick=()=>{c.ring(b.dataset.ring);draw()});
</script>
