<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation Copilot</title></head>
<body><main><h1>Conversation Copilot</h1><p id="status">Connecting to Even G2…</p>
<label>Backend<select id="provider"><option value="OPENAI">OpenAI</option><option value="XAI">xAI / Grok</option><option value="GEMINI">Google Gemini cloud</option><option value="GEMINI_NANO">Gemini Nano · offline</option></select></label>
<label>Conversation language<select id="language"><option value="en-US">American English</option><option value="de-DE">German</option><option value="el-GR">Greek</option><option value="es-ES">Spanish</option><option value="fr-FR">French</option><option value="pl-PL">Polish</option><option value="ru-RU">Russian</option><option value="uk-UA">Ukrainian</option><option value="zh-CN">Chinese (Simplified)</option></select></label>
<label>Style<select id="style"><option value="P">Playful</option><option value="S">Strategic / trust-building</option><option value="C">Argumentative / contrarian</option></select></label>
<label class="toggle"><input id="native" type="checkbox"> Show native characters instead of phonetic English</label>
<button id="mic">Start G2 microphone</button><button id="refresh">Refresh all eight branches</button>
<p class="help">New conversation context continuously generates ranked, anticipatory candidates. Low-relevance branches are replaced; a branch being spoken is pinned. R1 scroll selects; R1 press regenerates all eight; double press closes.</p>
<pre id="log"></pre></main><script type="module" src="/evenhub/main.ts"></script></body></html>
