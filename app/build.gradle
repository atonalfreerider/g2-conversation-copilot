plugins { id 'com.android.application' }

android {
    namespace 'com.g2copilot.settings'
    compileSdk 35
    defaultConfig {
        applicationId 'com.g2copilot.settings'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
    testImplementation 'junit:junit:4.13.2'
}
